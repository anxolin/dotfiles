# ----------------------
#   ENV vars
# -----------------------
# Used by version-specific guards (%if "#{>=:#{version},X}") and OS-specific sourcing below.

# TMUX_VERSION (e.g. "3.5") — for legacy `if-shell` checks. New code uses `%if "#{>=:#{version},X}"`.
run-shell 'tmux setenv -g TMUX_VERSION $( tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p" )'

# ZSH_PATH — used by `set -g default-command $ZSH_PATH` below
run-shell "tmux setenv -g ZSH_PATH $(which zsh)"

# OS — used to gate macOS-only sources (e.g. c&p-osx.conf)
run-shell "tmux setenv -g OS $(uname -s)"

# ----------------------
#   Basic Config
# -----------------------

# Set Ctrl-a as the default prefix key combination
# and unbind C-b to free it up
set -g prefix C-a
unbind C-b

# Automatically renumber tmux windows
set -g renumber-windows on

# Tmux windows as tabs (using shift)
bind -n S-down new-window
bind -n S-left prev
bind -n S-right next
#bind -n S-up confirm kill-window

#	urxvt tab like window switching (-n: no prior escape seq)
#bind -n C-left swap-window -t -1
#bind -n C-right swap-window -t +1

# Send a to the current pane even its the prefix combination (so in shell it gos to the beginig)
bind a send-prefix

# Make delay shorter
set -sg escape-time 0

# Use send-prefix to pass C-a through to application
bind C-a send-prefix

# Shorten command delay
set -sg escape-time 1

# Enable focus events for autoread in vim/nvim
set-option -g focus-events on

# Resize behaviour: Maximum size
#   Rather than constraining window size to the maximum size of any client connected to the *session*, 
#   constrain window size to the maximum size of any  client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Autorename window 
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# Display time for messages (2s)
set-option -g display-time 2000

# Use zsh
set -g default-command $ZSH_PATH

# ----------------------
#   Remapings
# -----------------------

# Reload ~/.tmux.conf using PREFIX r
bind R source-file ~/.tmux.conf \; display-message "  🔄  Reloaded tmux conf!"


# Use PREFIX | to split window horizontally and PREFIX - to split vertically
# New splits inherit the current shell's working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Make the current window the first window
bind T swap-window -t 1
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Map Vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use C-h and C-l to cycle thru panes
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Update session working directory:ttach-session -c "#{pane_current_path}" \; display ""
bind C attach-session -c "#{pane_current_path}" \; display-message "  ✅  Update session working directory!"

# Working dir:
#   Open a new window in the current
#bind M-c new-window -c "#{pane_current_path}"


# -----------------------------------
#   Colors (version specific config)
# -----------------------------------
#   - 🧪 Test: ~/dotfiles/scripts/check-colors-24bit.sh
#   - TROUBLESHOOTING:
#       - Source of troubles: SSH/Mosh, tmux config, vim config, terminal reported by the client ($TERM)
#       - Check if TC or RGB is enabled:
#           tmux info | grep -e RGB -e Tc
#       - Check vim or nvim
#           vim :checkhealth
#       - echo $TERM
#       - Check in your machine (the script), then check using SSH in the target machine, then test with mosh
#       - See also https://gist.github.com/bbqtd/a4ac060d6f6b9ea6fe3aabe735aa9d95#installing-tmux-256color-for-macos

# Terminal type configuration
#   - Check color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

#set -g default-terminal "tmux-256color"
#set-option -sa terminal-features ',tmux-256color:RGB'
#set -sa terminal-overrides ",tmux-256color:RGB"


# Color definition changed in 2.9 to be more compact (removed -fg,-bg sufix and replaced by -style one)
# Using %if instead of `bc`-based if-shell so we don't break on systems without bc installed
%if "#{>=:#{version},2.9}"
  source-file ~/dotfiles/tmux/color.conf
%else
  source-file ~/dotfiles/tmux/color-legacy.conf
%endif

# ----------------------
#   Copy & Paste
# -----------------------

# COPY AND PASTE
#  1) CTRL+a, ESC       Start copy mode    (additionally to the original [ )
#  2) v  OR  <space>    Start selection
#  3) y                 Yank
#  4) P		              Paste (note that it is capitay P)
bind Escape copy-mode
unbind p
bind p paste-buffer
# The reamining config is in tmux-osx.conf,

# Forward OSC 52 clipboard writes from inner panes (e.g. vim on a remote host
# over mosh/ssh) to the outer terminal. Without this, tmux swallows the
# escape sequence and clipboard never reaches the system.
set -g set-clipboard on
# terminal-features requires tmux >= 3.2
%if "#{>=:#{version},3.2}"
set -as terminal-features ',*:clipboard'
%endif

# Load version specific conf for Copy & Paste
%if "#{>=:#{version},2.4}"
  source-file ~/dotfiles/tmux/c&p-^2.4.conf
%else
  source-file ~/dotfiles/tmux/c&p-legacy.conf
%endif

# Load OS specific conf for Copy & Paste
if-shell 'test "$OS" = Darwin' 'source-file ~/dotfiles/tmux/c&p-osx.conf'
#if-shell 'test "$OS" = Linux'  'source-file ~/dotfiles/tmux/c&p-linux.conf'


# ----------------------
#   Status Bar
# -----------------------
set-option -g status on                # turn the status bar on
set -g status-interval 5               # set update frequencey (default 15 seconds)
set -g status-justify centre           # center window list for clarity
# set-option -g status-position top    # position the status bar at top of screen

# Visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# Show "Session name" and "Host name" on left side of status bar
set -g status-left-length 25
set -g status-left "[#[fg=yellow]#[fg=red]#S#[fg=yellow]] #[fg=green]#h"

# Show "Pane" and "Window" number on the right of status bar
set -g status-right-length 10
set -g status-right "#[fg=blue]#P:#I #[fg=yellow] v$TMUX_VERSION"


# ----------------------
#   UTF-8 support (only tmux < 2.2)
# -----------------------
# UTF8 is autodetected in 2.2 onwards, but errors if explicitly set
%if "#{<:#{version},2.2}"
  set -g utf8 on
  set -g status-utf8 on
  set -g mouse-utf8 on
%endif


# ----------------------
#   Mouse support
# -----------------------

# Enable mouse
set -g mouse on

# Allow mouse scroll
#   http://tangledhelix.com/blog/2012/07/16/tmux-and-mouse-mode/
bind -T root WheelUpPane   if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"


# ----------------------
#   Mouse support
# -----------------------


# ----------------------
#   History
# -----------------------

# Set the history limit
set -g history-limit 30000

# Prefix + r → fuzzy-pick from ~/.tmux_history (most-recent first), then prefill ":" prompt
set -s history-file ~/.tmux_history



# ----------------------
#   PLUGINS
# -----------------------

#   - TPM: https://github.com/tmux-plugins/tpm
#   - Plugin list: https://github.com/tmux-plugins/list

# tmux-tpm: Plugin manager. It is Initialize at the very bottom of tmux.conf
set -g @plugin 'tmux-plugins/tpm'

# tmux-sensible: Basic default configuration for tmux
set -g @plugin 'tmux-plugins/tmux-sensible'

# Solarized theme (disabled in favour of catppuccin; kept for quick rollback)
# set -g @plugin 'seebi/tmux-colors-solarized'
# set -g @colors-solarized 'dark'

# Catppuccin theme — matches nvim colorscheme. Pin to `latest` tag so breaking
# config changes in main don't surprise us.
#   Docs: https://github.com/catppuccin/tmux
set -g @plugin 'catppuccin/tmux#latest'
set -g @catppuccin_flavor 'mocha'           # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'

# Status bar layout — must be set BEFORE `run tpm` so catppuccin's modules render.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -agF status-right '#{E:@catppuccin_status_session}'
set -agF status-right '#{E:@catppuccin_status_uptime}'

# tmux-fzf: Use fzf to manage tmux (sessions, windows, panes, etc.)
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-fzf: launcher key is bound explicitly below (after tpm) — this option is a
# no-op because the plugin reads $TMUX_FZF_LAUNCH_KEY (env var), not this tmux option.
# set -g @tmux-fzf-launch-key "F"

# Put the "command" picker first in tmux-fzf menu
set-environment -g TMUX_FZF_ORDER "command|session|window|pane|keybinding|clipboard|process"

# Keep the current session in the session-switch picker (default hides it).
set-environment -g TMUX_FZF_SWITCH_CURRENT 1

# Popup size for all tmux-fzf pickers. Defaults to 62% × 38%; -m enables multi-select.
set-environment -g TMUX_FZF_OPTIONS "-p -w 95% -h 95% -m"

# prefix + s  → jump straight to tmux-fzf's session *switch* picker (skip action menu).
# prefix + X  → same list, but kill. TAB marks multiple sessions for batch kill.
# Overrides tmux's built-in `choose-tree -Zs`, which doesn't fuzzy-search.
bind s run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"
bind X run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh kill"

# prefix + S  → tmux's built-in choose-tree (non-fuzzy, shows full session/window tree).
bind S choose-tree -Zs

# tmux-resurrect: Save/restore tmux environment to disk.
#   prefix + Ctrl-s  → save all sessions, windows, panes, layouts, cwds
#   prefix + Ctrl-r  → restore from last save
#   Snapshots live in ~/.local/share/tmux/resurrect/ (or ~/.tmux/resurrect/ on older versions).
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Also restore shell history (last N lines per pane) and running program detection.
set -g @resurrect-capture-pane-contents 'on'
# Restore vim/nvim sessions if present (uses vim-obsession / :mksession).
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: Auto-save tmux environment every N minutes + auto-restore on tmux start.
#   Relies on tmux-resurrect.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'  # minutes (0 to disable)
# Auto-save stays on so we never lose state, but don't auto-restore on tmux start —
# with many sessions, spinning them all up is expensive and usually not what I want.
# Restore manually when needed with: prefix + Ctrl-r
# set -g @continuum-restore 'on'
set -g @continuum-restore 'off'       # auto-restore when tmux server starts


# ----------------------
#  TMUX plugin manager (MUST be at the very bottom)
# -----------------------

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible (loaded by tpm above) overrides default-command on macOS to
# "reattach-to-user-namespace -l $SHELL", where $SHELL is the env var tmux saw
# when the server started — often /bin/sh if tmux was spawned by a non-zsh
# parent. That makes every new / resurrected pane start as /bin/sh instead of
# zsh. Re-assert the correct shell here, AFTER tpm, so we win.
set -g default-command "$ZSH_PATH -l"

# tmux-fzf launcher — bound *after* tpm so we override the plugin's default `F`.
# prefix + f  → tmux-fzf menu (command|session|window|pane|...)
# prefix + F  → tmux's built-in find-window prompt
bind f run-shell -b "~/.tmux/plugins/tmux-fzf/main.sh"
bind F command-prompt -p "(find-window)" "find-window -Z -- '%%'"



# ----------------------
#  Fuzzy search bindings (Must come after TPM loads plugins)
# -----------------------

# Prefix+r: Search command history via a popup.
# display-popup and -w/-h percentages require tmux >= 3.2, so the binding
# lives in a separate file that is only sourced on a new-enough tmux.
# (tmux 3.1c's %if can't skip past a multi-line quoted command body.)
%if "#{>=:#{version},3.2}"
source-file ~/dotfiles/tmux/tmux.popup.conf
%endif

