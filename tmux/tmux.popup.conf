# Popup-based bindings. Loaded only when tmux >= 3.2 (see tmux.conf).

# Prefix+r: Search command history from ~/.tmux_history
bind-key r display-popup -E -w 80% -h 60% "
  HIST=\"\${TMUX_HISTORY_FILE:-\$HOME/.tmux_history}\"
  command -v fzf >/dev/null 2>&1 || { echo 'fzf not found'; read -p 'Press enter...'; exit; }
  [ -r \"\$HIST\" ] || { echo \"No history file: \$HIST\"; read -p 'Press enter...'; exit; }

  if command -v gtac >/dev/null 2>&1; then
    REVCMD='gtac \"\$HIST\"'
  elif tail -r /dev/null >/dev/null 2>&1; then
    REVCMD='tail -r \"\$HIST\"'
  else
    REVCMD='awk '\"'\"'{line[NR]=\$0} END{for(i=NR;i>0;i--) print line[i]}'\"'\"' \"\$HIST\"'
  fi

  # Filter only 'command:' entries, strip prefix, dedupe, then fzf
  sel=\$(eval \"\$REVCMD\" | grep '^command:' | sed 's/^command://' | awk 'NF && !seen[\$0]++' | fzf --prompt='cmd> ' --no-sort --height=100%)
  [ -n \"\$sel\" ] && tmux command-prompt -I \"\$sel\"
"
